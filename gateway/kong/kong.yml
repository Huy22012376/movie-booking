_format_version: "3.0"
plugins:
  - name: cors
    config:
      origins: ["*"]
      methods: ["GET", "POST", "PUT", "DELETE", "OPTIONS"]
      headers: ["Accept", "Content-Type", "Authorization"]
services:
  - name: booking-service
    host: booking-upstream
    port: 3002
    protocol: http
    routes:
      - name: booking-route
        paths: ["/api/booking"]
        strip_path: false
  - name: user-service
    url: http://user-service:3005
    routes:
      - name: user-route
        paths: ["/api/users", "/api/auth"]
        strip_path: false
  - name: payment-service
    url: http://payment-service:3004
    routes:
      - name: payment-route
        paths: ["/api/payments"]
        strip_path: false
  - name: seat-locking
    url: http://seat-locking:3003
    routes:
      - name: seat-route
        paths: ["/api/seats"]
        strip_path: false

upstreams:
  - name: booking-upstream
    targets:
      - target: booking-service:3002
        weight: 100
      - target: booking-service-2:3002
        weight: 100
